name: Validate and publish tested WhatsApp images

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact validated proxy and MCP images
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Scan Git history for secrets
        run: python scripts/ci-secret-scan.py
      - name: Install, audit and test proxy with mocked WhatsApp
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
      - name: Install, audit and test MCP with mocked proxy
        run: |
          python -m pip install --upgrade pip==26.3
          pip install --only-binary=:all: -r mcp/requirements.txt
          pip check
          pip install pip-audit
          pip-audit -r mcp/requirements.txt --no-deps --disable-pip
          python mcp/test_mcp.py
      - name: Validate Compose and source-only quickstart templates
        run: |
          node scripts/init-env.js
          docker compose --env-file docker/.env -f docker/docker-compose.yml -f docker/docker-compose.build.yml -f docker/docker-compose.local.yml config --quiet
      - name: Build candidate images once
        id: images
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.licenses=ISC" --label "org.opencontainers.image.version=$(node -p 'require("./package.json").version')" --tag whatsapp-proxy-ci --file docker/Dockerfile .
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.licenses=ISC" --label "org.opencontainers.image.version=$(node -p 'require("./package.json").version')" --tag whatsapp-mcp-ci --file mcp/Dockerfile mcp
      - name: Exercise isolated images and credential preservation
        run: bash scripts/ci-image-smoke.sh
      - name: Scan proxy candidate before publication
        if: always() && steps.images.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-proxy-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
      - name: Scan MCP candidate before publication
        if: always() && steps.images.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-mcp-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
      - name: Preserve the exact tested images
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: docker save whatsapp-proxy-ci whatsapp-mcp-ci | gzip > tested-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          name: tested-whatsapp-images
          path: tested-images.tar.gz
          retention-days: 2
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-whatsapp-images
      - name: Publish the tested commit and versioned images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gzip -dc tested-images.tar.gz | docker load
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          proxy="$base:sha-$GITHUB_SHA"
          mcp="$base-mcp:sha-$GITHUB_SHA"
          docker tag whatsapp-proxy-ci "$proxy"
          docker tag whatsapp-mcp-ci "$mcp"
          docker push "$proxy"
          docker push "$mcp"
          version=$(jq -er .version package.json)
          docker tag whatsapp-proxy-ci "$base:$version"
          docker tag whatsapp-mcp-ci "$base-mcp:$version"
          docker push "$base:$version"
          docker push "$base-mcp:$version"
          proxy_digest=$(docker image inspect "$proxy" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$base@" '[.[] | select(startswith($prefix))] | if length == 1 then .[0] else error("Registry digest missing or ambiguous") end')
          mcp_digest=$(docker image inspect "$mcp" --format '{{json .RepoDigests}}' | jq -er --arg prefix "${base}-mcp@" '[.[] | select(startswith($prefix))] | if length == 1 then .[0] else error("Registry digest missing or ambiguous") end')
          printf '{"commit":"%s","proxy":"%s","mcp":"%s"}\n' "$GITHUB_SHA" "$proxy_digest" "$mcp_digest" > release-metadata.json
          cat release-metadata.json >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/publish-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whatsapp-public-release
          path: release-metadata.json
          if-no-files-found: error
