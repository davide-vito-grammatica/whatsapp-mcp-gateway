[server]
# Porta del server
port=3000

[keepalive]
# Intervallo in minuti per inviare messaggi keep-alive
interval_minutes=10

# Gruppo WhatsApp per i messaggi keep-alive
group_id=

# Abilitazione keep-alive (true/false)
enabled=false

# Messaggio personalizzato (opzionale, se vuoto usa messaggio automatico)
custom_message=

[email]
# Configurazione email per notifiche di errore
smtp_host=smtp.gmail.com
smtp_port=587
smtp_secure=false
smtp_user=your-email@gmail.com
smtp_password=your-app-password
from_email=your-email@gmail.com
to_email=admin@example.com

# Abilitazione notifiche email
enabled=false

# Timeout di connessione WhatsApp prima di inviare email (minuti)
connection_timeout_minutes=20

# Intervallo tra gli avvisi email mentre WhatsApp rimane disconnesso (minuti)
# Se omesso, viene usato email_cooldown_minutes per compatibilità.
disconnection_alert_interval_minutes=60

# Intervallo minimo legacy tra email (minuti)
email_cooldown_minutes=60

[session]
# Numero massimo di errori SessionError prima del reset automatico
max_session_errors=5

# Tempo di cooldown tra reset automatici (minuti)
reset_cooldown_minutes=5

# Abilitazione auto-recovery (true/false)
auto_recovery_enabled=true
